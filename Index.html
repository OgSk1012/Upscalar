<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4K Maker</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --text:#eef0f4; --muted:#9aa1ae; --accent:#4f8cff; --ok:#3ecf8e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:760px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:1.6rem; margin:8px 0 4px; }
  p.sub { color:var(--muted); margin:0 0 20px; }
  #drop { border:2px dashed #3a4050; border-radius:16px; padding:36px 16px; text-align:center; background:var(--card); cursor:pointer; }
  #drop.over { border-color:var(--accent); }
  #drop strong { display:block; font-size:1.1rem; margin-bottom:6px; }
  .opts { display:flex; flex-wrap:wrap; gap:12px; margin:16px 0; align-items:center; }
  label { color:var(--muted); font-size:.9rem; }
  select, button { background:var(--card); color:var(--text); border:1px solid #3a4050; border-radius:10px; padding:10px 14px; font-size:.95rem; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.5; }
  .row { display:flex; justify-content:space-between; gap:10px; background:var(--card); border-radius:12px; padding:12px; margin-bottom:8px; align-items:center; }
  .name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .info { color:var(--muted); font-size:.8rem; }
  .bar { height:10px; background:#2a2f3a; border-radius:6px; overflow:hidden; margin:14px 0 6px; }
  .bar > div { height:100%; width:0; background:var(--accent); transition:width .2s; }
  a.dl { color:#fff; background:var(--ok); padding:8px 14px; border-radius:10px; font-weight:600; text-decoration:none; white-space:nowrap; }
  #warn { color:#ffcc66; font-size:.85rem; margin:8px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>4K Maker</h1>
  <p class="sub">Images ya ZIP upload karo (100+ images bhi chalengi). Sab kuch aapke browser me hota hai, kuch upload nahi hota.</p>

  <div id="drop">
    <strong>Images ya ZIP yahan drop karo / tap karo</strong>
    <span class="info">JPG, PNG, WEBP, ZIP (zip ke andar folders bhi chalenge)</span>
    <input id="file" type="file" accept="image/*,.zip,application/zip" multiple hidden>
  </div>

  <div id="sources" style="margin-top:14px"></div>

  <div class="opts">
    <label>Format<br>
      <select id="fmt">
        <option value="image/jpeg">JPG (chhoti file, recommended)</option>
        <option value="image/png">PNG (bahut bhari)</option>
        <option value="image/webp">WEBP</option>
      </select>
    </label>
    <label>Sharpness<br>
      <select id="sharp">
        <option value="0">Off</option>
        <option value="0.4" selected>Halka</option>
        <option value="0.8">Strong</option>
      </select>
    </label>
    <label>Ek ZIP me images<br>
      <select id="part">
        <option value="20">20</option>
        <option value="30" selected>30</option>
        <option value="50">50</option>
      </select>
    </label>
    <button id="go" class="primary" disabled>4K banao</button>
  </div>
  <div id="warn">Bade kaam me ye tab khula rakho aur screen band mat karo.</div>

  <div id="progress" hidden>
    <div class="bar"><div id="barfill"></div></div>
    <div class="info" id="ptext"></div>
  </div>

  <div id="results" style="margin-top:16px"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const TARGET = 3840; // lambi side = 3840px (4K UHD)
const IMG_RE = /\.(jpe?g|png|webp|bmp|gif)$/i;
const $ = id => document.getElementById(id);
const drop = $('drop'), fileInput = $('file'), go = $('go');
let jobs = []; // { name, getBlob }

drop.onclick = () => fileInput.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); addFiles(e.dataTransfer.files); };
fileInput.onchange = () => { addFiles(fileInput.files); fileInput.value = ''; };

function addRow(title, detail) {
  const el = document.createElement('div');
  el.className = 'row';
  el.innerHTML = '<div style="min-width:0"><div class="name"></div><div class="info"></div></div>';
  el.querySelector('.name').textContent = title;
  el.querySelector('.info').textContent = detail;
  $('sources').appendChild(el);
}

async function addFiles(files) {
  for (const f of files) {
    const isZip = /\.zip$/i.test(f.name) || f.type.includes('zip');
    if (isZip) {
      try {
        const zip = await JSZip.loadAsync(f);
        let n = 0;
        zip.forEach((path, entry) => {
          if (entry.dir || path.startsWith('__MACOSX') || /(^|\/)\./.test(path) || !IMG_RE.test(path)) return;
          jobs.push({ name: path, getBlob: () => entry.async('blob') });
          n++;
        });
        addRow(f.name, n + ' images mili');
      } catch (e) {
        addRow(f.name, 'ZIP khul nahi payi');
      }
    } else if (f.type.startsWith('image/')) {
      jobs.push({ name: f.name, getBlob: async () => f });
      addRow(f.name, '1 image');
    }
  }
  go.disabled = jobs.length === 0;
}

// Step-by-step upscale (har step max 2x) taaki quality achhi rahe
  let zip = new JSZip(), inPart = 0, partNo = 1, done = 0, failed = [];

  async function flush() {
    if (!inPart) return;
    $('ptext').textContent = 'ZIP ban rahi hai...';
    const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
    addResult(inPart + ' images', blob, '4k-images-part' + partNo + '.zip');
    zip = new JSZip(); inPart = 0; partNo++;
  }

  for (const job of jobs) {
    $('ptext').textContent = (done + 1) + ' / ' + total + ' · ' + job.name;
    await new Promise(r => setTimeout(r, 20)); // UI ko saans lene do
    try {
      const blob = await job.getBlob();
      const res = await processOne(blob, type, amt);
      let path = job.name.replace(/\.[^.]+$/, '') + '-4k.' + ext, n = 2;
      while (used.has(path)) path = job.name.replace(/\.[^.]+$/, '') + '-4k-' + (n++) + '.' + ext;
      used.add(path);
      if (total === 1) {
        addResult(res.from + ' → ' + res.to, res.out, path.split('/').pop());
      } else {
        zip.file(path, res.out);
        inPart++;
        if (inPart >= perPart) await flush();
      }
    } catch (e) {
      failed.push(job.name);
    }
    done++;
    $('barfill').style.width = (done / total * 100) + '%';
  }
  await flush();
  $('ptext').textContent = 'Ho gaya! ' + (total - failed.length) + ' images 4K me ban gayi.' +
    (failed.length ? ' Fail: ' + failed.length + ' (' + failed.slice(0, 3).join(', ') + (failed.length > 3 ? '...' : '') + ')' : '');
  jobs = []; $('sources').innerHTML = '';
};
</script>
</body>
</html>
